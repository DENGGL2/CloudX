name: Build cloud code APKs

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-arm64:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Build arm64 APK
        run: ./gradlew :app:assembleDebug -Parm64Only=true

      - name: Upload arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: cloud-code-arm64-v8a-debug
          path: app/build/outputs/apk/debug/app-arm64-v8a-debug.apk

      - name: Build universal APK
        run: ./gradlew :app:assembleDebug

      - name: Upload universal APK
        uses: actions/upload-artifact@v4
        with:
          name: cloud-code-universal-debug
          path: app/build/outputs/apk/debug/app-debug.apk
